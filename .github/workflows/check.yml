name: Checks
on: [push, pull_request]
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_bucket_api.py --check
      - run: python -m osv check examples/java-oss.json
      - run: python -m osv check examples/cpp-s3.json
      - run: python -m osv check examples/java-cos.json
      - run: python -m osv check examples/cpp-cos.json
      - run: python -m osv check examples/cpp-obs.json
      - run: python -m osv run examples/selftest.json --output results/selftest
      - run: python -m osv catalog examples/selftest.json --profile complete > results/complete-catalog.json
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: drivers/java/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build.py java
      - name: Package actual Java SDK worker under minimum memory budgets
        run: python3 -m unittest discover -s tests -p test_build.py -v
        env:
          OSV_RUN_BUILD_TESTS: '1'
      - name: COS Java SDK HTTP contract tests
        run: python3 -m unittest discover -s tests/integration -p test_cos_sdk.py -v
        env:
          OSV_RUN_COS_TESTS: '1'
          OSV_COS_TEST_LANGUAGES: java
      - name: Java native and S3 SDK request contracts
        run: python3 -m unittest discover -s tests/integration -p test_page_sdk.py -v
        env:
          OSV_RUN_PAGE_TESTS: '1'
          OSV_PAGE_TEST_TARGETS: java:s3,java:oss,java:obs,java:tos,java:cos
      - name: Java conditional, metadata, copy, Range and tagging SDK contracts
        run: python3 -m unittest discover -s tests/integration -p 'test_*_sdk.py' -v
        env:
          OSV_RUN_CONDITION_TESTS: '1'
          OSV_RUN_METADATA_TESTS: '1'
          OSV_RUN_COPY_TESTS: '1'
          OSV_RUN_HTTP_TESTS: '1'
          OSV_RUN_TAG_TESTS: '1'
          OSV_RUN_HEADER_TESTS: '1'
          OSV_RUN_BUCKET_TESTS: '1'
          OSV_RUN_LIST_TESTS: '1'
          OSV_RUN_DELETE_TESTS: '1'
          OSV_RUN_MULTIPART_TESTS: '1'
          OSV_RUN_VERSION_TESTS: '1'
          OSV_RUN_API_MODEL_TESTS: '1'
          OSV_RUN_SSE_CUSTOMER_TESTS: '1'
          OSV_RUN_ENCRYPTION_TESTS: '1'
          OSV_RUN_IDENTITY_TESTS: '1'
          OSV_RUN_ACL_TESTS: '1'
          OSV_RUN_WIRE_HEADER_TESTS: '1'
          OSV_S3_TEST_LANGUAGES: java
          OSV_PAGE_TEST_TARGETS: java:s3,java:oss,java:obs,java:tos,java:cos
      - name: Install local S3 integration server
        run: python3 -m pip install 'moto[server]==5.1.15' boto3
      - name: Local S3 service state isolation
        run: PYTHONPATH=tests/integration:. python3 -m unittest test_local_moto -v
        env:
          OSV_RUN_MOTO_TESTS: '1'
      - name: Java AWS SDK normal, multikey and strict Ceph diagnostics
        run: python3 -m unittest discover -s tests/integration -p test_s3_sdk.py -v
        env:
          OSV_RUN_SDK_TESTS: '1'
          OSV_S3_TEST_LANGUAGES: java
      - name: Java alternate identity ACL and object interoperability diagnostics
        run: python3 -m unittest discover -s tests/integration -p test_ceph_access_sdk.py -v
        env:
          OSV_RUN_SDK_TESTS: '1'
          OSV_S3_TEST_LANGUAGES: java
      - name: Java policy, metadata and checksum source diagnostics
        run: PYTHONPATH=tests/integration:. python3 -m unittest test_policy_conditions_sdk test_metadata_edges_sdk test_checksum_attributes_sdk -v
        env:
          OSV_RUN_POLICY_CONDITION_TESTS: '1'
          OSV_RUN_METADATA_EDGES_TESTS: '1'
          OSV_RUN_CHECKSUM_ATTRIBUTE_TESTS: '1'
          OSV_S3_TEST_LANGUAGES: java
      - name: Java version conditions, public controls and complete copy contracts
        run: PYTHONPATH=tests/integration:. python3 -m unittest test_conditional_versions_sdk test_public_controls_sdk test_copy_contracts_sdk -v
        env:
          OSV_RUN_CONDITIONAL_VERSIONS_TESTS: '1'
          OSV_RUN_PUBLIC_CONTROL_TESTS: '1'
          OSV_RUN_COPY_CONTRACT_TESTS: '1'
          OSV_S3_TEST_LANGUAGES: java
      - name: Java shared-client concurrency, state, policies and logging controls
        run: PYTHONPATH=tests/integration:. python3 -m unittest test_state_boundaries_sdk test_basic_boundaries_sdk test_policy_remaining_sdk test_logging_controls_sdk -v
        env:
          OSV_RUN_STATE_BOUNDARY_TESTS: '1'
          OSV_RUN_BASIC_BOUNDARY_TESTS: '1'
          OSV_RUN_REMAINING_POLICY_TESTS: '1'
          OSV_RUN_LOGGING_CONTROL_TESTS: '1'
          OSV_S3_TEST_LANGUAGES: java
      - name: Java source HTTP, query, lifecycle, locking and delivered logs
        run: PYTHONPATH=tests/integration:. python3 -m unittest test_wire_query_sdk test_raw_http_sdk test_query_edges_sdk test_lifecycle_expiration_sdk test_lifecycle_transition_sdk test_lifecycle_marker_expiration_sdk test_object_locks_sdk test_logging_records_sdk -v
        env:
          OSV_RUN_WIRE_QUERY_TESTS: '1'
          OSV_RUN_RAW_HTTP_TESTS: '1'
          OSV_RUN_QUERY_EDGES_TESTS: '1'
          OSV_RUN_LIFECYCLE_EXPIRATION_TESTS: '1'
          OSV_RUN_LIFECYCLE_TRANSITION_TESTS: '1'
          OSV_RUN_LIFECYCLE_MARKER_TESTS: '1'
          OSV_RUN_OBJECT_LOCK_TESTS: '1'
          OSV_RUN_LOGGING_RECORD_TESTS: '1'
          OSV_S3_TEST_LANGUAGES: java
  obs-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned official OBS C SDK
        uses: actions/checkout@v4
        with:
          repository: huaweicloud/huaweicloud-sdk-c-obs
          ref: 927c5320d10c9dfc14e4b20fd2eb210daeca166e
          path: .deps/obs-sdk
      - name: Install JSON headers
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev
      - name: Build official OBS C SDK with resource guards
        run: |
          python3 scripts/build.py command -- cmake -S .deps/obs-sdk -B .deps/obs-sdk-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          python3 scripts/build.py command -- cmake --build .deps/obs-sdk-build --parallel '{jobs}'
          python3 scripts/obs_runtime.py --source .deps/obs-sdk --library .deps/obs-sdk-build/lib/libeSDKOBS.so --output .deps/obs-runtime
      - name: Build C++ adapter linked to OBS C SDK
        run: python3 scripts/build.py cpp --without-s3 --with-tests --obs-source .deps/obs-sdk --obs-library .deps/obs-runtime/libeSDKOBS.so
      - name: C++ response IO regression tests
        run: ctest --test-dir drivers/cpp/build --output-on-failure
      - name: Test real OBS C SDK requests and callbacks
        run: python3 -m unittest discover -s tests/integration -p test_obs_sdk.py -v
        env:
          OSV_RUN_OBS_TESTS: '1'
          OSV_OBS_LIBRARY_PATH: ${{ github.workspace }}/.deps/obs-runtime
      - name: OBS C SDK single-page, streaming and service error contracts
        run: python3 -m unittest discover -s tests/integration -p test_page_sdk.py -v
        env:
          OSV_RUN_PAGE_TESTS: '1'
          OSV_PAGE_TEST_TARGETS: cpp:obs
          OSV_OBS_LIBRARY_PATH: ${{ github.workspace }}/.deps/obs-runtime
      - name: OBS C SDK conditional, metadata and copy contracts
        run: python3 -m unittest discover -s tests/integration -p 'test_*_sdk.py' -v
        env:
          OSV_RUN_CONDITION_TESTS: '1'
          OSV_RUN_METADATA_TESTS: '1'
          OSV_RUN_COPY_TESTS: '1'
          OSV_PAGE_TEST_TARGETS: cpp:obs
          OSV_OBS_LIBRARY_PATH: ${{ github.workspace }}/.deps/obs-runtime
