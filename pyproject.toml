[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "object-storage-validation"
version = "0.1.0"
description = "Workload-driven object storage compatibility and SDK comparison harness"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
osv = "osv.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/ceph-s3-tests-LICENSE"]

[tool.setuptools.packages.find]
include = ["osv*"]

[tool.setuptools.package-data]
osv = ["data/*.json"]
